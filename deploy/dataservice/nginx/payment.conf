location ~* ^/api/(wxpay/refund/notify) {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    rewrite ^/wxpay/refund/notify/([^/]+)/([^/]+)/([^/]+) /wxpay/refund/notify break;
    # 设置请求头，对多租户进行扩展支持
    proxy_set_header App-Type $1;
    proxy_set_header Client-Type $2;
    proxy_set_header channel $3;

    # 服务关停开关，切换下两行的注释
    proxy_pass http://dev-single;
    #root /usr/share/nginx/html/stop;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 3600s;

    # 客户端真实 IP 传递到服务器
    proxy_set_header X-Real-IP $remote_addr;
    # 首先这个header并不是必需的，其次这个header host和proxy_pass转发产生的hostheader会出现冲突
    # 导致接口502的情况。但是这个配置更新后，nginx重启包括使用nginx -t进行测试也不会报错
    proxy_set_header Host $host;
    # 客户端或上一级端口
    proxy_set_header X-Real-Port $remote_port;
    # 请求协议配置,请求方式
    proxy_set_header X-Forwarded-Proto $scheme;
    # 包含了客户端和各级代理ip的完整ip链路
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}