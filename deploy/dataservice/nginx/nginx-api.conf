server {
    listen 80;
    listen 443 ssl;
    # 不暴露 Nginx 版本信息
    server_tokens off;
    server_name template.xtechcn.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/template.xtechcn.com;

    # Http 转 Https
    if ($server_port !~ 443) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    ssl_certificate /www/ssl/xtechcn.com.pem;
    ssl_certificate_key  /www/ssl/xtechcn.com.key;
    ssl_session_timeout 600s;
    ssl_session_cache shared:SSL:50m;
    ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
    ssl_protocols SSLv3 SSLv2 TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers  on;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    ############################# 服务配置开始 ################################

    location ~* ^/(auth|static) {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://xtechcn-single-template;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;

        # 客户端真实 IP 传递到服务器
        proxy_set_header X-Real-IP $remote_addr;
        # 首先这个header并不是必需的，其次这个header host和proxy_pass转发产生的hostheader会出现冲突
        # 导致接口502的情况。但是这个配置更新后，nginx重启包括使用nginx -t进行测试也不会报错
        proxy_set_header Host $host;
        # 客户端或上一级端口
        proxy_set_header X-Real-Port $remote_port;
        # 请求协议配置,请求方式
        proxy_set_header X-Forwarded-Proto $scheme;
        # 包含了客户端和各级代理ip的完整ip链路
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # API 接口
    location ~* ^/api/ {
        # 去掉最顶层的路径 /api/
        rewrite "^/api/(.*)$" /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://xtechcn-single-template;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;

        # 客户端真实 IP 传递到服务器
        proxy_set_header X-Real-IP $remote_addr;
        # 首先这个header并不是必需的，其次这个header host和proxy_pass转发产生的hostheader会出现冲突
        # 导致接口502的情况。但是这个配置更新后，nginx重启包括使用nginx -t进行测试也不会报错
        proxy_set_header Host $host;
        # 客户端或上一级端口
        proxy_set_header X-Real-Port $remote_port;
        # 请求协议配置,请求方式
        proxy_set_header X-Forwarded-Proto $scheme;
        # 包含了客户端和各级代理ip的完整ip链路
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    ############################# 服务配置结束 ################################

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known {
        allow all;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/dev.template.xtechcn.com.log;
    error_log  /www/wwwlogs/dev.template.xtechcn.com.error.log;
}


# RAD
upstream xtechcn-single-template {
    # 服务器 24
    server 192.168.1.24:9527;
}
